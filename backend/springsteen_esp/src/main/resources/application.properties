spring.application.name=springsteen_esp
spring.datasource.url=jdbc:mysql://localhost:3306/springsteenesp
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.data.mongodb.uri=mongodb://localhost:27017/springsteen_reviews
spring.data.mongodb.database=springsteen_reviews

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed.sql
spring.jpa.defer-datasource-initialization=true